name: Mirror Repository

on:
  push:
    branches: ['**']
    tags: ['*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Target Repo
        env:
          TARGET_REPO: github.com/${{ vars.MIRROR_TARGET_REPO }}.git
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_TOKEN secret is not configured" >&2
            exit 1
          fi
          if [ -z "${{ vars.MIRROR_TARGET_REPO }}" ]; then
            echo "MIRROR_TARGET_REPO repository variable is not configured" >&2
            exit 1
          fi
          git -c "http.https://${TARGET_REPO}/.extraheader=AUTHORIZATION: bearer ${MIRROR_TOKEN}" \
            push --mirror "https://${TARGET_REPO}"
