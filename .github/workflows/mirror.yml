name: Mirror Repository

on:
  push:
    branches: ['**']
    tags: ['*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Target Repo
        env:
          TARGET_REPO: github.com/${{ vars.MIRROR_TARGET_REPO }}.git
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MIRROR_TOKEN secret is not configured" >&2
            exit 1
          fi
          if [ -z "${{ vars.MIRROR_TARGET_REPO }}" ]; then
            echo "MIRROR_TARGET_REPO repository variable is not configured" >&2
            exit 1
          fi
          git push --prune "https://x-access-token:${TOKEN}@${TARGET_REPO}" \
            'refs/remotes/origin/*:refs/heads/*' \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
