name: Mirror Repository

on:
  push:
    branches: ['**']
    tags: ['*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Source Refs
        run: |
          git fetch origin '+refs/heads/*:refs/heads/*' --prune
          git for-each-ref --format='delete %(refname)' refs/remotes/origin \
            | git update-ref --stdin

      - name: Push to Target Repo
        env:
          TARGET_REPO: github.com/${{ vars.MIRROR_TARGET_REPO }}.git
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MIRROR_TOKEN secret is not configured" >&2
            exit 1
          fi
          if [ -z "${{ vars.MIRROR_TARGET_REPO }}" ]; then
            echo "MIRROR_TARGET_REPO repository variable is not configured" >&2
            exit 1
          fi
          git push --mirror "https://x-access-token:${TOKEN}@${TARGET_REPO}"
